</div>
</div>
<!-- Password Field -->
<div class="space-y-stack-gap-sm">
<div class="flex justify-between items-center">

<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>

                        Log in

</button>

<p class="font-label-caps text-label-caps text-outline">© 2024 VIRALCUT ENTERPRISE. SECURED &amp; ENCRYPTED.</p>
</footer>
<script>
        // Simple click interaction for the login button
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.classList.remove('hover:animate-shimmer');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
                btn.classList.replace('shimmer-btn', 'bg-money-green');
                btn.classList.add('animate-bounce');
                
                // Redirect simulation
                setTimeout(() => {
                    alert('Login successful! Welcome back to ViralCut.');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-money-green', 'shimmer-btn');
                    btn.classList.add('hover:animate-shimmer');
                    btn.classList.remove('animate-bounce');
                }, 1000);
            }, 1500);
        });

        // Password visibility toggle
        const toggleBtn = document.getElementById('password-toggle');
        const passInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            const icon = toggleBtn.querySelector('span');
            
            // Micro-interaction for icon
            icon.style.transform = 'scale(0.5)';
            icon.style.opacity = '0';
            
            setTimeout(() => {
                icon.textContent = isPass ? 'visibility_off' : 'visibility';
                icon.style.transform = 'scale(1)';
                icon.style.opacity = '1';
            }, 150);
        });
    </script>
