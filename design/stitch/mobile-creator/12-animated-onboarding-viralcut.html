<style>
        .onboarding-gradient {
            background: radial-gradient(circle at 80% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 10% 80%, rgba(34, 197, 94, 0.1) 0%, transparent 40%);
        }
        .hero-floating {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .glass-card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Motion System */
        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUpBounce {
            0% { opacity: 0; transform: translateY(100px); }
            70% { opacity: 1; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes rhythmicFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes shimmerPulse {
            0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); }
            100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
        }
        @keyframes expandPill {
            from { width: 8px; opacity: 0; }
            to { width: 24px; opacity: 1; }
        }

        .animate-slide-down { animation: slideDownFade 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-slide-up { opacity: 0; animation: slideUpFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-hero-entrance { opacity: 0; animation: slideUpBounce 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-float-verified { animation: rhythmicFloat 4s ease-in-out infinite; }
        .animate-shimmer { animation: shimmerPulse 2.5s infinite; }
        .animate-expand-pill { animation: expandPill 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        .delay-200 { animation-delay: 200ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-700 { animation-delay: 700ms; }

        @media (prefers-reduced-motion: reduce) {
            .animate-slide-down, .animate-slide-up, .animate-hero-entrance, .animate-float-verified, .animate-shimmer, .animate-expand-pill, .hero-floating {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
