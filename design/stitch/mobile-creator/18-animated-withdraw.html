<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed": "#002113",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#0b1c30",
                    "outline": "#7b7487",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#eff4ff",
                    "on-surface": "#0b1c30",
                    "secondary": "#006c49",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "tertiary-fixed": "#ffdbca",
                    "tertiary-container": "#aa4900",
                    "secondary-fixed": "#6ffbbe",
                    "surface-container-high": "#dce9ff",
                    "on-primary-fixed-variant": "#5a00c6",
                    "on-tertiary-container": "#ffdecf",
                    "inverse-on-surface": "#eaf1ff",
                    "on-surface-variant": "#4a4455",
                    "inverse-surface": "#213145",
                    "on-secondary-container": "#00714d",
                    "deep-surface": "#0F172A",
                    "primary-fixed-dim": "#d2bbff",
                    "on-tertiary": "#ffffff",
                    "primary": "#630ed4",
                    "on-tertiary-fixed": "#341100",
                    "surface-tint": "#732ee4",
                    "surface": "#f8f9ff",
                    "silver-clipper": "#E2E8F0",
                    "secondary-fixed-dim": "#4edea3",
                    "secondary-container": "#6cf8bb",
                    "outline-variant": "#ccc3d8",
                    "surface-bright": "#f8f9ff",
                    "primary-fixed": "#eaddff",
                    "surface-variant": "#d3e4fe",
                    "surface-container": "#e5eeff",
                    "money-green": "#22C55E",
                    "inverse-primary": "#d2bbff",
                    "on-error-container": "#93000a",
                    "tertiary": "#843700",
                    "tertiary-fixed-dim": "#ffb690",
                    "surface-dim": "#cbdbf5",
                    "on-secondary": "#ffffff",
                    "urgency-orange": "#EA580C",
                    "on-secondary-fixed-variant": "#005236",
                    "background": "#f8f9ff",
                    "on-primary-fixed": "#25005a",
                    "surface-container-highest": "#d3e4fe",
                    "primary-container": "#7c3aed",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#783200",
                    "danger-red": "#EF4444",
                    "on-primary-container": "#ede0ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "20px",
                    "unit": "4px",
                    "stack-gap-md": "16px",
                    "stack-gap-lg": "24px",
                    "stack-gap-sm": "8px",
                    "section-margin": "32px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "label-caps": ["Inter"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "financial-data": ["Plus Jakarta Sans"],
                    "status-pill": ["Inter"],
                    "display-hero": ["Plus Jakarta Sans"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "financial-data": ["20px", {"lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "800"}],
                    "status-pill": ["11px", {"lineHeight": "12px", "fontWeight": "600"}],
                    "display-hero": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: theme('colors.outline-variant'); border-radius: 10px; }
        
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(99, 14, 212, 0.2); border-color: theme('colors.outline-variant'); }
            50% { box-shadow: 0 0 15px rgba(99, 14, 212, 0.4); border-color: theme('colors.primary'); }
        }
        @keyframes arrowPulse {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(4px); }
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .animate-entrance { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        .chip-pop { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; }
        
        .input-glow:focus-within { animation: glowPulse 2s infinite ease-in-out; }
        
        .cta-shimmer { position: relative; overflow: hidden; }
        .cta-shimmer::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-entrance, .chip-pop, .input-glow, .cta-shimmer::after, .arrow-pulse {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
        
        body { min-height: max(884px, 100dvh); }
    </style>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary/20">
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/80 flex justify-between items-center px-container-padding h-16 w-full">
<div class="flex items-center gap-stack-gap-md">
<button class="p-2 -ml-2 hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-150" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-on-surface">Withdraw</h1>
</div>
<div class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">account_balance_wallet</span>
        ViralCut Wallet
    </div>
</header>
<main class="pt-24 pb-32 px-container-padding max-w-lg mx-auto">
<!-- Balance Hero -->
<section class="animate-entrance mb-section-margin bg-deep-surface text-white p-6 rounded-xl shadow-lg relative overflow-hidden">
<div class="absolute -right-8 -top-8 w-32 h-32 bg-primary/20 rounded-full blur-3xl"></div>
<p class="font-label-caps text-label-caps text-primary-fixed-dim mb-1 uppercase tracking-widest">Available Balance</p>
<h2 class="font-display-hero text-display-hero">₹35,170</h2>
<div class="mt-4 flex items-center gap-2">
<span class="inline-flex h-2 w-2 rounded-full bg-money-green animate-pulse"></span>
<p class="text-body-md text-slate-400">Ready to transfer</p>
</div>
</section>
<!-- Withdrawal Form Stack -->
<div class="flex flex-col gap-stack-gap-lg">
<!-- Amount Input Section -->
<section class="animate-entrance delay-1">
<div class="flex justify-between items-end mb-stack-gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Enter Amount</label>
<button class="text-primary font-label-caps text-label-caps hover:underline active:scale-95 transition-transform" id="useMax">USE MAX</button>
</div>
<div class="relative group input-glow rounded-xl">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-financial-data text-on-surface-variant">₹</span>
<input class="w-full bg-surface-container-lowest border-2 border-outline-variant rounded-xl py-4 pl-10 pr-4 font-financial-data text-headline-lg focus:border-primary focus:ring-0 transition-all outline-none" id="withdrawAmount" placeholder="0" type="number" value="1000"/>
</div>
<!-- Presets -->
<div class="flex gap-2 mt-4 overflow-x-auto pb-2 custom-scrollbar">
<button class="chip-pop delay-1 whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps hover:bg-primary-fixed hover:border-primary transition-all active:scale-90" onclick="addAmount(1000)">+1K</button>
<button class="chip-pop delay-2 whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps hover:bg-primary-fixed hover:border-primary transition-all active:scale-90" onclick="addAmount(5000)">+5K</button>
<button class="chip-pop delay-3 whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps hover:bg-primary-fixed hover:border-primary transition-all active:scale-90" onclick="addAmount(10000)">+10K</button>
<button class="chip-pop delay-4 whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps hover:bg-primary-fixed hover:border-primary transition-all active:scale-90" onclick="addAmount(25000)">+25K</button>
</div>
</section>
<!-- Destination Selection -->
<section class="animate-entrance delay-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-stack-gap-sm block">Withdraw To</label>
<div class="flex flex-col gap-stack-gap-sm">
<!-- Bank Option -->
<label class="relative flex items-center p-4 rounded-xl border-2 border-outline-variant bg-surface-container-lowest cursor-pointer transition-all duration-300 hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/30 has-[:checked]:scale-[1.02] group">
<input checked="" class="hidden" name="method" type="radio" value="bank"/>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mr-4 transition-colors group-has-[:checked]:bg-primary/10">
<span class="material-symbols-outlined text-on-surface-variant group-has-[:checked]:text-primary transition-colors">account_balance</span>
</div>
<div class="flex-1">
<p class="font-headline-md text-on-surface">HDFC Bank</p>
<p class="text-body-md text-on-surface-variant">•••• 8829</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all group-has-[:checked]:border-primary group-has-[:checked]:bg-primary">
<div class="w-2 h-2 rounded-full bg-white scale-0 group-has-[:checked]:scale-100 transition-transform"></div>
</div>
</label>
<!-- UPI Option -->
<label class="relative flex items-center p-4 rounded-xl border-2 border-outline-variant bg-surface-container-lowest cursor-pointer transition-all duration-300 hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/30 has-[:checked]:scale-[1.02] group">
<input class="hidden" name="method" type="radio" value="upi"/>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mr-4 transition-colors group-has-[:checked]:bg-primary/10">
<span class="material-symbols-outlined text-on-surface-variant group-has-[:checked]:text-primary transition-colors">qr_code_2</span>
</div>
<div class="flex-1">
<p class="font-headline-md text-on-surface">UPI ID</p>
<p class="text-body-md text-on-surface-variant">creator@hdfcbank</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all group-has-[:checked]:border-primary group-has-[:checked]:bg-primary">
<div class="w-2 h-2 rounded-full bg-white scale-0 group-has-[:checked]:scale-100 transition-transform"></div>
</div>
</label>
</div>
</section>
<!-- Summary Table -->
<section class="animate-entrance delay-3 bg-surface-container-low p-5 rounded-xl border border-outline-variant/50">
<h3 class="font-label-caps text-label-caps text-on-surface mb-4">TRANSACTION SUMMARY</h3>
<div class="space-y-3">
<div class="flex justify-between items-center">
<span class="text-body-md text-on-surface-variant">Withdrawal Amount</span>
<span class="font-financial-data text-on-surface transition-all duration-500" id="summaryAmount">₹1,000</span>
</div>
<div class="flex justify-between items-center">
<span class="text-body-md text-on-surface-variant">Platform Fee (1.5%)</span>
<span class="font-financial-data text-danger-red transition-all duration-500" id="summaryFee">-₹15</span>
</div>
<div class="pt-3 border-t border-outline-variant flex justify-between items-center">
<span class="font-headline-md text-on-surface">Final Receive</span>
<span class="font-display-hero text-headline-lg text-primary transition-all duration-500" id="summaryTotal">₹985</span>
</div>
</div>
</section>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 w-full p-container-padding bg-surface/90 backdrop-blur-md border-t border-outline-variant/30 flex flex-col items-center">
<button class="w-full max-w-lg py-4 bg-primary text-white rounded-full font-headline-md shadow-xl shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-2 cta-shimmer" id="withdrawBtn">
<span>Withdraw Now</span>
<span class="material-symbols-outlined" style="animation: arrowPulse 1.5s infinite ease-in-out;">trending_flat</span>
</button>
<p class="mt-3 text-label-caps text-on-surface-variant text-[10px] text-center opacity-70">Funds will be credited within 24-48 working hours.</p>
</div>
<!-- Success Banner (Hidden by default) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-lg bg-money-green text-white p-4 rounded-xl shadow-2xl z-[60] flex items-center gap-3 opacity-0 translate-y-8 pointer-events-none transition-all duration-500" id="successBanner">
<span class="material-symbols-outlined">check_circle</span>
<span class="font-body-md font-semibold">Withdrawal request submitted successfully!</span>
</div>
<script>
        const input = document.getElementById('withdrawAmount');
        const summaryAmount = document.getElementById('summaryAmount');
        const summaryFee = document.getElementById('summaryFee');
        const summaryTotal = document.getElementById('summaryTotal');
        const useMax = document.getElementById('useMax');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const successBanner = document.getElementById('successBanner');

        function animateNumberChange(element) {
            element.classList.remove('opacity-0');
            element.classList.add('opacity-40');
            setTimeout(() => {
                element.classList.remove('opacity-40');
            }, 100);
        }

        function updateSummary() {
            let val = parseFloat(input.value) || 0;
            if (val > 35170) {
                val = 35170;
                input.value = 35170;
            }
            const fee = (val * 0.015).toFixed(2);
            const total = (val - fee).toFixed(2);

            summaryAmount.innerText = `₹${val.toLocaleString()}`;
            summaryFee.innerText = `-₹${parseFloat(fee).toLocaleString()}`;
            summaryTotal.innerText = `₹${parseFloat(total).toLocaleString()}`;
            
            animateNumberChange(summaryAmount);
            animateNumberChange(summaryFee);
            animateNumberChange(summaryTotal);
            
            if (val <= 0) {
                withdrawBtn.disabled = true;
                withdrawBtn.classList.add('opacity-50', 'grayscale');
            } else {
                withdrawBtn.disabled = false;
                withdrawBtn.classList.remove('opacity-50', 'grayscale');
            }
        }

        function addAmount(amount) {
            let current = parseFloat(input.value) || 0;
            input.value = current + amount;
            updateSummary();
        }

        useMax.addEventListener('click', () => {
            input.value = 35170;
            updateSummary();
        });

        input.addEventListener('input', updateSummary);

        withdrawBtn.addEventListener('click', () => {
            withdrawBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Processing...`;
            withdrawBtn.disabled = true;
            
            setTimeout(() => {
                // Show custom success banner instead of alert
                successBanner.classList.remove('opacity-0', 'translate-y-8');
                successBanner.classList.add('opacity-100', 'translate-y-0');
                
                setTimeout(() => {
                    location.reload();
                }, 2500);
            }, 1200);
        });

        // Initialize summary
        updateSummary();
    </script>
</body></html>
