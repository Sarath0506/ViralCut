<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .bg-pattern {
            background-color: #f8f9ff;
            background-image: radial-gradient(#d3e4fe 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        /* High-fidelity Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }

        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        /* Focus Ring & Label Shifts */
        .input-group:focus-within .material-symbols-outlined {
            transform: translateY(-50%) scale(1.1);
            color: #7c3aed !important;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .input-group:focus-within label {
            transform: translateX(4px);
            color: #7c3aed !important;
            transition: all 0.3s ease;
        }

        /* Performance / Accessibility */
        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in-up, .shimmer-btn::after {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .active\:scale-95, .active\:scale-98 {
                transform: none !important;
            }
        }

        .active\:scale-98:active {
            transform: scale(0.98);
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/80 flex justify-between items-center px-container-padding h-16 w-full animate-fade-in-up" style="animation-delay: 0.1s;">
<h1 class="font-display-hero text-headline-md text-primary">ViralCut</h1>
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-primary">language</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">EN</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center pt-24 pb-12 px-container-padding bg-pattern">
<div class="w-full max-w-[440px] flex flex-col gap-stack-gap-lg">
<div class="flex flex-col gap-unit animate-fade-in-up" style="animation-delay: 0.3s;">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Create account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join the elite network of digital entrepreneurs.</p>
</div>
<form class="flex flex-col gap-stack-gap-md bg-surface-container-lowest p-stack-gap-lg rounded-xl border border-silver-clipper shadow-sm animate-fade-in-up" id="signup-form" style="animation-delay: 0.4s;">
<div class="flex flex-col gap-stack-gap-sm input-group">
<label class="font-label-caps text-label-caps text-on-surface-variant transition-all duration-300" for="full-name">FULL NAME</label>
<div class="relative group">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-bright font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all duration-300" id="full-name" placeholder="Enter your full name" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant transition-all duration-300">person</span>
</div>
</div>
<div class="flex flex-col gap-stack-gap-sm input-group">
<label class="font-label-caps text-label-caps text-on-surface-variant transition-all duration-300" for="phone">PHONE</label>
<div class="flex gap-2">
<div class="flex items-center justify-center h-12 px-3 rounded-lg border border-outline-variant bg-surface-container-low font-body-md text-on-surface-variant">
                        +91
                    </div>
<input class="flex-grow h-12 px-4 rounded-lg border border-outline-variant bg-surface-bright font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all duration-300" id="phone" placeholder="98765 43210" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-stack-gap-sm input-group">
<label class="font-label-caps text-label-caps text-on-surface-variant transition-all duration-300" for="email">EMAIL</label>
<div class="relative group">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-bright font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all duration-300" id="email" placeholder="name@company.com" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant transition-all duration-300">mail</span>
</div>
</div>
<div class="flex flex-col gap-stack-gap-sm input-group">
<label class="font-label-caps text-label-caps text-on-surface-variant transition-all duration-300" for="password">PASSWORD</label>
<div class="relative group">
<input class="w-full h-12 px-4 pr-12 rounded-lg border border-outline-variant bg-surface-bright font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all duration-300" id="password" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary active:scale-95 transition-all" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<div class="py-2">
<p class="font-body-md text-body-md text-on-surface-variant text-center leading-relaxed">
                    By signing up you agree to our <a class="text-primary font-bold hover:underline" href="#">Terms</a> &amp; <a class="text-primary font-bold hover:underline" href="#">Privacy Policy</a>
</p>
</div>
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-headline-md text-headline-md shadow-lg shadow-primary/20 active:scale-98 hover:bg-primary/90 transition-all flex items-center justify-center gap-2 shimmer-btn" type="submit">
                Create account

</button>

<div class="flex flex-col items-center gap-stack-gap-md animate-fade-in-up" style="animation-delay: 0.5s;">
<div class="flex items-center w-full gap-4">

<button class="flex-1 h-12 flex items-center justify-center gap-2 border border-outline-variant rounded-lg bg-surface-bright hover:bg-surface-container-low active:scale-98 transition-all font-body-md">

                    Facebook
                </button>
</div>
<div class="mt-4">
<p class="font-body-lg text-body-lg text-on-surface">
                    Already have an account? <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
</div>
</div>
</main>
<div class="fixed -bottom-12 -left-12 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed -top-12 -right-12 w-64 h-64 bg-secondary/5 rounded-full blur-3xl pointer-events-none"></div>
<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('password-toggle-icon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.innerText = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            icon.innerText = 'visibility';
        }
    }

    document.getElementById('signup-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Creating...`;
        btn.classList.remove('shimmer-btn');
        setTimeout(() => {
            btn.innerHTML = `Success!`;
            btn.classList.replace('bg-primary', 'bg-money-green');
        }, 1000);
    });
</script>
